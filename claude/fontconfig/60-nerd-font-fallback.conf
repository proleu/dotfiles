<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Keep the terminal's own face, but route glyphs it lacks (Nerd Font PUA
       icons drawn by the YAS statusline) to JetBrainsMono Nerd Font.

       Two rules learned the hard way:

       1. append + weak ONLY. binding="strong" or mode="prepend" promotes the
          Nerd Font to primary monospace and changes how all terminal text
          looks, which is not the point.
       2. Name the real families, not just generic "monospace". GNOME hands the
          terminal its system monospace font by name (Ubuntu Sans Mono here), so
          a monospace-only rule never fires and every icon stays tofu.

       fontconfig is read at process start: restart every terminal window (they
       share one gnome-terminal-server) after changing this. -->
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>JetBrainsMono Nerd Font</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Ubuntu Sans Mono</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>JetBrainsMono Nerd Font</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Ubuntu Mono</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>JetBrainsMono Nerd Font</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>DejaVu Sans Mono</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>JetBrainsMono Nerd Font</string>
    </edit>
  </match>
</fontconfig>
